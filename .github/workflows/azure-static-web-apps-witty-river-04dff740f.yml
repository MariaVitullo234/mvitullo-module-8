name: Upload artifact and deploy
uses: Azure/static-web-apps-deploy@v1
with:
    azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    repo_token: ${{ secrets.GITHUB_TOKEN }}
    action: 'upload'
    app_location: '/'        # this is your root folder with index.html
    api_location: ''         # you don't have an API
    output_location: ''      # nothing gets built
    skip_app_build: true     # <---- THIS IS THE FIX
